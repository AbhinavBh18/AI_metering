name: Verify capstone
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: metering
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: metering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metering -d metering_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://metering:ci_local_only@localhost:5432/metering_test
      TEST_DATABASE_URL: postgresql://metering:ci_local_only@localhost:5432/metering_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pytest -v
      - run: python -m app seed
      - run: python -m compileall -q app config.py
