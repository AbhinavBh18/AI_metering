name: flyrank-capstone-metering-billing
track: backend-ai-engineer
language: python
run: python -m app run
seed: python -m app seed
test: python -m pytest -q
base_url: http://localhost:8000
endpoints:
  - method: GET
    path: /health
  - method: GET
    path: /plans
  - method: POST
    path: /generate
    auth: Bearer tenant API key from data/demo-credentials.json
    headers:
      Idempotency-Key: evaluator-request-1
    body:
      input_tokens: 1000
      cached_input_tokens: 400
      output_tokens: 500
      reasoning_tokens: 200
  - method: GET
    path: /usage
    auth: Bearer tenant API key
  - method: POST
    path: /billing/checkout
    auth: Bearer tenant API key
  - method: POST
    path: /webhooks/stripe
    auth: Stripe-Signature header
  - method: GET
    path: /billing/jobs
    auth: Bearer tenant API key
